upstream inventory_backend {
    server 127.0.0.1:8001 max_fails=3 fail_timeout=10s;
    server 127.0.0.1:8002 max_fails=3 fail_timeout=10s;
    server 127.0.0.1:8003 max_fails=3 fail_timeout=10s;

    keepalive 16;
}


server {
    listen 8080;
    listen [::]:8080;

    server_name localhost 127.0.0.1;


    client_max_body_size 10M;


    location /api/ {
        proxy_pass http://inventory_backend;

        proxy_http_version 1.1;

        proxy_set_header Host $host;

        proxy_set_header X-Real-IP $remote_addr;

        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_set_header Connection "";


        proxy_connect_timeout 5s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;


        proxy_next_upstream
            error
            timeout
            http_502
            http_503
            http_504;


        add_header
            X-Upstream-Addr
            $upstream_addr
            always;
    }


    location / {
        return 200 "Inventory load balancer is running.\n";

        add_header
            Content-Type
            text/plain;
    }
}
